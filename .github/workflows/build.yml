name: Build DZR CAST APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip DZR-CAST archive
        run: |
          if [ -f "DZR-CAST.zip" ]; then
            unzip -o DZR-CAST.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        working-directory: DZR-CAST
        run: gradle assembleDebug --no-daemon

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: DZR CAST v${{ github.run_number }}
          files: DZR-CAST/app/build/outputs/apk/**/*.apk

